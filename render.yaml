# Render Blueprint — API + PostgreSQL (produção).
# O frontend é publicado no Cloudflare Pages; ele encaminha /api/* para este serviço
# (functions/api/[[path]].js). Homologação: deploy/render.staging.yaml.
# Confira no painel os planos disponíveis na sua conta antes de aplicar.

databases:
  - name: formacaprof-db
    databaseName: formacaprof
    user: formacaprof
    plan: basic-256mb
    postgresMajorVersion: "17"
    # Sem acesso externo: só serviços da mesma conta/região conectam pela rede privada.
    ipAllowList: []

services:
  - type: web
    name: formacaprof-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    # Migrations versionadas, aplicadas antes de cada deploy (nunca `prisma db push`).
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: formacaprof-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: TRUST_PROXY
        value: "2"
      - key: PROXY_SECRET
        generateValue: true
      - key: SWAGGER_ENABLED
        value: "false"
      - key: MAIL_DRIVER
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Limites de upload pelo painel (MB). Vídeo pela API fica desligado (0): vídeos são
      # registrados como URL externa na biblioteca de mídia.
      - key: MEDIA_MAX_IMAGE_MB
        value: "5"
      - key: MEDIA_MAX_PDF_MB
        value: "25"
      - key: MEDIA_MAX_VIDEO_MB
        value: "0"
    # Disco persistente só para os uploads feitos pelo painel (capas, PDFs). Sem ele, os arquivos
    # enviados somem a cada deploy. Os arquivos que já vêm na imagem (storage/basta) não são afetados.
    disk:
      name: formacaprof-uploads
      mountPath: /app/storage/uploads
      sizeGB: 1
